name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install BLAST+
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ncbi-blast+
      - name: Install package
        run: python -m pip install -e ".[genomics]" ruff
      - name: Lint
        run: python -m ruff check src tests
      - name: Unit and end-to-end tests
        run: python -m unittest discover -s tests -v
      - name: Built-in self-test
        run: ng-amr --self-test
